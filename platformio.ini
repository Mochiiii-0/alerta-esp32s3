[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Serial sale por el puerto UART (COM). Para usar el puerto USB nativo del S3, cambiar a 1
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=0   ; no llenar el monitor con errores internos (por ejemplo del I2C)
; Evita que el monitor reinicie o bloquee la placa por el USB nativo
monitor_rts = 0
monitor_dtr = 0
